<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kindle 电子墨水屏桌面时钟</title>
    <script>
      /* Polyfills for Kindle Voyage / Older WebKit Browsers */
      (function() {
        if (typeof window === 'undefined') return;
        
        // Polyfill globalThis
        if (typeof globalThis === 'undefined') {
          window.globalThis = window;
        }

        // Polyfill ResizeObserver
        if (!window.ResizeObserver) {
          window.ResizeObserver = function(cb) {
            this.cb = cb;
            this.observe = function() {};
            this.unobserve = function() {};
            this.disconnect = function() {};
          };
        }

        // Polyfill IntersectionObserver
        if (!window.IntersectionObserver) {
          window.IntersectionObserver = function(cb) {
            this.cb = cb;
            this.observe = function() {};
            this.unobserve = function() {};
            this.disconnect = function() {};
          };
        }

        // Polyfill Element.prototype.animate (Web Animations API used by motion)
        if (typeof Element !== 'undefined' && !Element.prototype.animate) {
          Element.prototype.animate = function() {
            return {
              play: function() {},
              pause: function() {},
              cancel: function() {},
              finish: function() {},
              onfinish: null,
              addEventListener: function() {},
              removeEventListener: function() {}
            };
          };
        }

        // Polyfill AbortController & AbortSignal
        if (typeof window.AbortController === 'undefined') {
          window.AbortController = function AbortController() {
            this.signal = { aborted: false, addEventListener: function() {}, removeEventListener: function() {} };
            this.abort = function() { this.signal.aborted = true; };
          };
        }
        if (typeof window.AbortSignal === 'undefined') {
          window.AbortSignal = {};
        }
        if (!window.AbortSignal.timeout) {
          window.AbortSignal.timeout = function(ms) {
            var controller = new window.AbortController();
            setTimeout(function() { controller.abort(); }, ms);
            return controller.signal;
          };
        }

        // Polyfill Intl.DateTimeFormat.prototype.formatToParts
        if (typeof Intl !== 'undefined' && Intl.DateTimeFormat && !Intl.DateTimeFormat.prototype.formatToParts) {
          Intl.DateTimeFormat.prototype.formatToParts = function(date) {
            var formatted = this.format(date);
            return [
              { type: 'literal', value: formatted }
            ];
          };
        }

        // Polyfill String.prototype.padStart & padEnd
        if (!String.prototype.padStart) {
          String.prototype.padStart = function(targetLength, padString) {
            targetLength = targetLength >> 0;
            padString = String(typeof padString !== 'undefined' ? padString : ' ');
            if (this.length >= targetLength) return String(this);
            targetLength = targetLength - this.length;
            if (targetLength > padString.length) {
              padString += padString.repeat(targetLength / padString.length);
            }
            return padString.slice(0, targetLength) + String(this);
          };
        }
        if (!String.prototype.padEnd) {
          String.prototype.padEnd = function(targetLength, padString) {
            targetLength = targetLength >> 0;
            padString = String(typeof padString !== 'undefined' ? padString : ' ');
            if (this.length >= targetLength) return String(this);
            targetLength = targetLength - this.length;
            if (targetLength > padString.length) {
              padString += padString.repeat(targetLength / padString.length);
            }
            return String(this) + padString.slice(0, targetLength);
          };
        }

        // Polyfill Object.fromEntries
        if (!Object.fromEntries) {
          Object.fromEntries = function(entries) {
            if (!entries) return {};
            var obj = {};
            if (Array.isArray(entries)) {
              for (var i = 0; i < entries.length; i++) {
                var pair = entries[i];
                if (pair && pair.length >= 2) {
                  obj[pair[0]] = pair[1];
                }
              }
            } else if (typeof entries.forEach === 'function') {
              entries.forEach(function(pair) {
                if (pair && pair.length >= 2) {
                  obj[pair[0]] = pair[1];
                }
              });
            }
            return obj;
          };
        }

        // Polyfill matchMedia
        if (!window.matchMedia) {
          window.matchMedia = function() {
            return {
              matches: false,
              media: '',
              onchange: null,
              addListener: function() {},
              removeListener: function() {},
              addEventListener: function() {},
              removeEventListener: function() {},
              dispatchEvent: function() { return false; }
            };
          };
        }

        // Polyfill Object.assign
        if (typeof Object.assign !== 'function') {
          Object.assign = function(target) {
            if (target == null) throw new TypeError('Cannot convert undefined or null to object');
            var to = Object(target);
            for (var index = 1; index < arguments.length; index++) {
              var nextSource = arguments[index];
              if (nextSource != null) {
                for (var key in nextSource) {
                  if (Object.prototype.hasOwnProperty.call(nextSource, key)) {
                    to[key] = nextSource[key];
                  }
                }
              }
            }
            return to;
          };
        }

        // Polyfill Array.prototype.find & findIndex & includes
        if (!Array.prototype.find) {
          Array.prototype.find = function(predicate) {
            if (this == null) throw new TypeError('Array.prototype.find called on null or undefined');
            if (typeof predicate !== 'function') throw new TypeError('predicate must be a function');
            var list = Object(this);
            var length = list.length >>> 0;
            var thisArg = arguments[1];
            for (var i = 0; i < length; i++) {
              var value = list[i];
              if (predicate.call(thisArg, value, i, list)) return value;
            }
            return undefined;
          };
        }
        if (!Array.prototype.findIndex) {
          Array.prototype.findIndex = function(predicate) {
            if (this == null) throw new TypeError('Array.prototype.findIndex called on null or undefined');
            if (typeof predicate !== 'function') throw new TypeError('predicate must be a function');
            var list = Object(this);
            var length = list.length >>> 0;
            var thisArg = arguments[1];
            for (var i = 0; i < length; i++) {
              if (predicate.call(thisArg, list[i], i, list)) return i;
            }
            return -1;
          };
        }
        if (!Array.prototype.includes) {
          Array.prototype.includes = function(searchElement, fromIndex) {
            if (this == null) throw new TypeError('Array.prototype.includes called on null or undefined');
            var O = Object(this);
            var len = O.length >>> 0;
            if (len === 0) return false;
            var n = fromIndex | 0;
            var k = Math.max(n >= 0 ? n : len - Math.abs(n), 0);
            while (k < len) {
              if (O[k] === searchElement || (typeof O[k] === 'number' && typeof searchElement === 'number' && isNaN(O[k]) && isNaN(searchElement))) return true;
              k++;
            }
            return false;
          };
        }
        if (!String.prototype.includes) {
          String.prototype.includes = function(search, start) {
            if (typeof start !== 'number') start = 0;
            if (start + search.length > this.length) return false;
            return this.indexOf(search, start) !== -1;
          };
        }

        // Polyfill Promise.prototype.finally
        if (typeof Promise !== 'undefined' && !Promise.prototype.finally) {
          Promise.prototype.finally = function(callback) {
            var P = this.constructor;
            return this.then(
              function(value) { return P.resolve(callback()).then(function() { return value; }); },
              function(reason) { return P.resolve(callback()).then(function() { throw reason; }); }
            );
          };
        }

        // Polyfill String.prototype.repeat
        if (!String.prototype.repeat) {
          String.prototype.repeat = function(count) {
            count = Math.floor(count);
            if (this.length === 0 || count <= 0) return '';
            var result = '';
            var str = String(this);
            while (count > 0) {
              if (count & 1) result += str;
              count >>= 1;
              if (count) str += str;
            }
            return result;
          };
        }

        // Silent error handler for Kindle
        window.onerror = function(msg, url, line) {
          if (typeof console !== 'undefined' && console.error) {
            console.error('Kindle Log Error:', msg, url, line);
          }
          return true; // prevent default error dialog
        };
        window.addEventListener('error', function(e) {
          if (typeof console !== 'undefined' && console.error) {
            console.error('Kindle Event Error:', e.message || e);
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Kindle Voyage / Legacy Browser ES5 Standalone Clock -->
      <div id="kindle-fallback-clock" style="box-sizing: border-box; width: 100vw; min-height: 100vh; background: #ffffff; color: #000000; font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; padding: 24px 20px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; text-align: center; border: 4px solid #000000; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 99999; overflow: hidden;">
        <!-- Top Info Bar -->
        <div style="width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 2px solid #000000; margin-bottom: 15px;">
          <div style="font-size: 16px; font-weight: bold; letter-spacing: 1px;">KINDLE 墨水屏桌面时钟</div>
          <div id="fallback-weather" style="font-size: 16px; font-weight: bold;">北京 22°C 晴</div>
        </div>

        <!-- Center Main Time Display -->
        <div style="margin: auto 0; padding: 10px 0; width: 100%; max-width: 800px;">
          <!-- Time -->
          <div id="fallback-time" style="font-size: 80px; font-weight: 800; line-height: 1.1; letter-spacing: -2px; font-family: 'Courier New', Courier, monospace, sans-serif; margin-bottom: 15px;">
            00:00:00
          </div>

          <!-- Date -->
          <div id="fallback-date" style="font-size: 24px; font-weight: bold; margin-bottom: 16px; letter-spacing: 1px;">
            2026年7月24日 星期五
          </div>

          <!-- Lunar & Solar Term -->
          <div id="fallback-lunar" style="font-size: 18px; font-weight: bold; border: 2px solid #000000; display: inline-block; padding: 6px 20px; background: #ffffff; color: #000000;">
            农历六月十一 · 夏秋之交
          </div>
        </div>

        <!-- Bottom Action Bar & Status -->
        <div style="width: 100%; max-width: 800px; padding-top: 15px; border-top: 2px solid #000000; display: flex; flex-direction: column; align-items: center; gap: 10px;">
          <div id="fallback-status" style="font-size: 13px; font-weight: bold; color: #222222;">
            已开启 Kindle Voyage 兼容渲染模式
          </div>

          <div style="display: flex; gap: 12px; margin-top: 4px;">
            <button onclick="location.reload()" style="padding: 8px 18px; font-size: 14px; font-weight: bold; border: 2px solid #000000; background: #ffffff; color: #000000; cursor: pointer;">
              刷新页面
            </button>
            <button id="fallback-toggle-mode" onclick="toggleFallbackMode()" style="padding: 8px 18px; font-size: 14px; font-weight: bold; border: 2px solid #000000; background: #000000; color: #ffffff; cursor: pointer;">
              夜间黑底
            </button>
          </div>
        </div>
      </div>

      <script>
        /* ES5 Standalone Clock Script for Kindle Voyage */
        (function() {
          function updateFallbackClock() {
            var now = new Date();
            var hours = (now.getHours() < 10 ? '0' : '') + now.getHours();
            var minutes = (now.getMinutes() < 10 ? '0' : '') + now.getMinutes();
            var seconds = (now.getSeconds() < 10 ? '0' : '') + now.getSeconds();
            var timeElem = document.getElementById('fallback-time');
            if (timeElem) {
              timeElem.innerHTML = hours + ':' + minutes + ':' + seconds;
            }

            var year = now.getFullYear();
            var month = now.getMonth() + 1;
            var date = now.getDate();
            var days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            var dayStr = days[now.getDay()];
            var dateElem = document.getElementById('fallback-date');
            if (dateElem) {
              dateElem.innerHTML = year + '年' + month + '月' + date + '日 ' + dayStr;
            }

            var lunarElem = document.getElementById('fallback-lunar');
            if (lunarElem) {
              var lunarMonths = ['正', '二', '三', '四', '五', '六', '七', '八', '九', '十', '十一', '腊'];
              var lunarDays = ['初一', '初二', '初三', '初四', '初五', '初六', '初七', '初八', '初九', '初十',
                               '十一', '十二', '十三', '十四', '十五', '十六', '十七', '十八', '十九', '二十',
                               '廿一', '廿二', '廿三', '廿四', '廿五', '廿六', '廿七', '廿八', '廿九', '三十'];
              var solarTerms = ['小寒', '大寒', '立春', '雨水', '惊蛰', '春分', '清明', '谷雨', '立夏', '小满', '芒种', '夏至', '小暑', '大暑', '立秋', '处暑', '白露', '秋分', '寒露', '霜降', '立冬', '小雪', '大雪', '冬至'];
              var termIndex = Math.floor((month - 1) * 2 + (date > 15 ? 1 : 0));
              var currentTerm = solarTerms[termIndex % 24];
              lunarElem.innerHTML = '农历' + lunarMonths[(month - 1) % 12] + '月' + lunarDays[(date - 1) % 30] + ' · ' + currentTerm;
            }
          }

          function fetchFallbackWeather() {
            try {
              var stored = localStorage.getItem('kindle_desk_standby_settings_v1');
              var cityName = '北京';
              if (stored) {
                var data = JSON.parse(stored);
                if (data && data.weatherCity && data.weatherCity.name) {
                  cityName = data.weatherCity.name;
                }
              }

              var cachedW = localStorage.getItem('kindle_fallback_weather_cache');
              if (cachedW) {
                var parsedW = JSON.parse(cachedW);
                if (parsedW && parsedW.text && (new Date().getTime() - parsedW.time < 3600000)) {
                  var wElem = document.getElementById('fallback-weather');
                  if (wElem) wElem.innerHTML = parsedW.text;
                  return;
                }
              }

              var xhr = new XMLHttpRequest();
              xhr.open('GET', 'https://wttr.in/' + encodeURIComponent(cityName) + '?format=%l:+%t+%C&lang=zh', true);
              xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) {
                  var resp = xhr.responseText || '';
                  if (resp && resp.length < 50) {
                    var cleanResp = resp.replace(/\+/g, ' ').trim();
                    var wElem = document.getElementById('fallback-weather');
                    if (wElem) wElem.innerHTML = cleanResp;
                    localStorage.setItem('kindle_fallback_weather_cache', JSON.stringify({
                      text: cleanResp,
                      time: new Date().getTime()
                    }));
                  }
                }
              };
              xhr.send();
            } catch(e) {}
          }

          window.toggleFallbackMode = function() {
            var clockElem = document.getElementById('kindle-fallback-clock');
            var btnElem = document.getElementById('fallback-toggle-mode');
            var lunarElem = document.getElementById('fallback-lunar');
            if (!clockElem) return;

            var isDark = clockElem.style.background === 'rgb(0, 0, 0)' || clockElem.style.background === '#000000' || clockElem.style.background === 'black';
            if (isDark) {
              clockElem.style.background = '#ffffff';
              clockElem.style.color = '#000000';
              if (btnElem) {
                btnElem.style.background = '#000000';
                btnElem.style.color = '#ffffff';
                btnElem.innerHTML = '夜间黑底';
              }
              if (lunarElem) {
                lunarElem.style.background = '#ffffff';
                lunarElem.style.color = '#000000';
                lunarElem.style.border = '2px solid #000000';
              }
            } else {
              clockElem.style.background = '#000000';
              clockElem.style.color = '#ffffff';
              if (btnElem) {
                btnElem.style.background = '#ffffff';
                btnElem.style.color = '#000000';
                btnElem.innerHTML = '日间白底';
              }
              if (lunarElem) {
                lunarElem.style.background = '#000000';
                lunarElem.style.color = '#ffffff';
                lunarElem.style.border = '2px solid #ffffff';
              }
            }
          };

          updateFallbackClock();
          fetchFallbackWeather();
          setInterval(updateFallbackClock, 1000);
        })();
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
